name: Game-data ids

# Weekly: when the live items version differs from the one empire_core.gamedata.ids
# was generated from, regenerate the ids and open (or update) a pull request.
# Needs "Allow GitHub Actions to create and approve pull requests" in the repo's
# Actions settings. A pull request opened with GITHUB_TOKEN does not trigger CI;
# push to its branch, or close and reopen it, to run the checks.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gamedata-ids
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: gamedata-ids-update
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Compare the items versions
        id: versions
        run: |
          live=$(uv run --locked python -c "from empire_core.utils.troops import get_items_version; print(get_items_version())")
          committed=$(uv run --locked python -c "from empire_core.gamedata.ids import ITEMS_VERSION; print(ITEMS_VERSION)")
          echo "Live items v$live; the ids are from v$committed"
          echo "stale=$([ "$live" != "$committed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Regenerate the ids
        if: steps.versions.outputs.stale == 'true'
        run: uv run --locked python scripts/generate_gamedata_ids.py

      - name: Open or update the pull request
        if: steps.versions.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/empire_core/gamedata/ids; then
            echo "Regenerating changed nothing"
            exit 0
          fi
          version=$(uv run --locked python -c "from empire_core.gamedata.ids import ITEMS_VERSION; print(ITEMS_VERSION)")
          title="feat(gamedata): regenerate ids for items v$version"
          body="Generated by \`.github/workflows/gamedata-ids.yml\` with \`scripts/generate_gamedata_ids.py\` from items v$version.

          Members of rows that were renamed or removed in this items version are gone, so check the diff for names callers use."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/empire_core/gamedata/ids
          git commit -m "$title"
          git push --force origin "$BRANCH"

          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title" --body "$body"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$title" --body "$body"
          fi
