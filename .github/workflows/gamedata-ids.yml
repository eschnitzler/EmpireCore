name: Game-data ids

# Weekly: when the live items version differs from the one empire_core.gamedata.ids
# was generated from, regenerate the ids on the gamedata-ids-update branch and open
# (or update) a pull request listing every renamed, removed and added member. The
# branch is only pushed when its ids differ, with --force-with-lease, and never
# when it holds commits from anyone but github-actions[bot].
# Needs "Allow GitHub Actions to create and approve pull requests" in the repo's
# Actions settings. A pull request opened with GITHUB_TOKEN does not trigger CI;
# push to its branch, or close and reopen it, to run the checks.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gamedata-ids
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: gamedata-ids-update
      IDS: src/empire_core/gamedata/ids
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Compare the items versions
        id: versions
        run: |
          live=$(uv run --locked python -c "from empire_core.utils.troops import get_items_version; print(get_items_version())")
          committed=$(uv run --locked python -c "from empire_core.gamedata.ids import ITEMS_VERSION; print(ITEMS_VERSION)")
          if ! [[ "$live" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::The live items version is not dotted digits"
            exit 1
          fi
          echo "Live items v$live; the ids are from v$committed"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "stale=$([ "$live" != "$committed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Regenerate the ids
        if: steps.versions.outputs.stale == 'true'
        env:
          LIVE: ${{ steps.versions.outputs.live }}
        run: |
          items="$RUNNER_TEMP/items_v$LIVE.json"
          uv run --locked python -c "import json, sys; from empire_core.utils.troops import fetch_items_data; json.dump(fetch_items_data(sys.argv[1]), open(sys.argv[2], 'w'))" "$LIVE" "$items"
          uv run --locked python scripts/generate_gamedata_ids.py --items "$items" \
            --diff-names "$RUNNER_TEMP/names.md" --breaking-footer "$RUNNER_TEMP/footer.txt"

      - name: Open or update the pull request
        if: steps.versions.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.versions.outputs.live }}
        run: |
          git add -- "$IDS"
          if git diff --cached --quiet -- "$IDS"; then
            echo "Regenerating changed nothing"
            exit 0
          fi

          lease="$BRANCH:"
          push=true
          if remote=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH"); then
            foreign=$(git log --format='%an' "origin/master..$remote" | grep -vx 'github-actions\[bot\]' || true)
            if [ -n "$foreign" ]; then
              echo "::notice::$BRANCH has commits by someone other than github-actions[bot]; leaving it alone"
              exit 0
            fi
            if git diff --cached --quiet "$remote" -- "$IDS"; then
              echo "::notice::$BRANCH already holds these ids; nothing to push"
              push=false
            fi
            lease="$BRANCH:$remote"
          fi

          footer=$(cat "$RUNNER_TEMP/footer.txt")
          if [ -n "$footer" ]; then
            title="feat(gamedata)!: regenerate ids for items v$LIVE"
          else
            title="feat(gamedata): regenerate ids for items v$LIVE"
          fi
          printf '%s\n' "$title" > "$RUNNER_TEMP/message.txt"
          if [ -n "$footer" ]; then
            printf '\n%s\n' "$footer" >> "$RUNNER_TEMP/message.txt"
          fi

          {
            echo "Generated by \`.github/workflows/gamedata-ids.yml\` with \`scripts/generate_gamedata_ids.py\` from items v$LIVE."
            echo
            if [ -n "$footer" ]; then
              echo "**Breaking:** members below were renamed or removed; callers using them must change."
              echo
            fi
            head -c 60000 "$RUNNER_TEMP/names.md"
            if [ "$(wc -c < "$RUNNER_TEMP/names.md")" -gt 60000 ]; then
              echo
              echo "(List cut short; run \`scripts/generate_gamedata_ids.py --check --diff-names names.md\` for all of it.)"
            fi
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$push" = true ]; then
            git switch -C "$BRANCH"
            git commit -F "$RUNNER_TEMP/message.txt"
            git push --force-with-lease="$lease" origin "HEAD:refs/heads/$BRANCH"
          fi

          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base master --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
