name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # Plain `uv sync`/`uv run` rewrite uv.lock in place when it is stale, so a
      # drifted lock heals locally and is only ever caught by a --locked/--check
      # consumer. Every CI install is therefore locked, and this check names the
      # problem directly instead of surfacing it as an install failure.
      - name: Check the lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # What Pylance users see: the library has to be clean under pyright too, not only mypy
      - name: Check the library with basedpyright
        run: uv run --locked basedpyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: test (${{ matrix.python-version }})
    env:
      # Run every uv step on the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: uv run --locked pytest -v

      # Coverage on one entry only; no threshold until the baseline is known.
      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: |
          uv run --locked pytest -v --cov=empire_core --cov-report=term --cov-report=xml
          uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
