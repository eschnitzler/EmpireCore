name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # Plain `uv sync`/`uv run` rewrite uv.lock in place when it is stale, so a
      # drifted lock heals locally and is only ever caught by a --locked/--check
      # consumer. Every CI install is therefore locked, and this check names the
      # problem directly instead of surfacing it as an install failure.
      - name: Check the lockfile is in sync with pyproject
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    name: test (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run --locked pytest -v
