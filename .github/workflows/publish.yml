name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

      - name: Verify clean install is importable and ships its typing marker
        run: |
          uv venv /tmp/clean-venv
          uv pip install --python /tmp/clean-venv/bin/python .
          /tmp/clean-venv/bin/python -c "import empire_core"
          # PEP 561: without py.typed in the *installed* package, consumers'
          # type checkers ignore every annotation and the "fully typed" claim in
          # the description is false. tests/ can only see the source tree, so
          # assert it on the built artifact too.
          /tmp/clean-venv/bin/python - <<'PY'
          import pathlib
          import sys

          import empire_core

          marker = pathlib.Path(empire_core.__file__).with_name("py.typed")
          if not marker.is_file():
              sys.exit(f"::error::py.typed missing from the installed package at {marker}")
          print(f"py.typed present: {marker}")
          PY

  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Branch on the exit code, never on log text: --strict makes
          # "no release to make" exit 2, so any other non-zero exit is a real
          # failure (auth, changelog write, build) and must fail the job.
          # Grepping output instead let those failures report released=false --
          # or, if they happened after `uv build`, leave dist/ populated and let
          # the PyPI publish proceed against inconsistent tag state.
          status=0
          uv run semantic-release --strict version || status=$?

          if [ "$status" -eq 0 ]; then
            if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
              echo "::error::semantic-release reported a release but dist/ is empty"
              exit 1
            fi
            echo "Release created."
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "No release to make for this commit range."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::semantic-release failed with exit code $status"
            exit "$status"
          fi

      - name: Upload dist artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
