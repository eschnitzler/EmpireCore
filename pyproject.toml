[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "empire-core"
version = "0.41.0"
description = "Fully typed Python API for Goodgame Empire"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "E Joseph", email = "east1499@gmail.com" }
]
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "websocket-client>=1.9.0",
]

[project.urls]
Repository = "https://github.com/eschnitzler/EmpireCore"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
    "pre-commit>=3.5.0",
    "types-requests",
    "python-semantic-release>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/empire_core"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"] # Pycodestyle, Pyflakes, Isort, Bugbear
# Nothing is ignored globally. Every entry that used to live here (E701, F841,
# B007, E402) suppressed zero violations, and the two that did suppress
# something have been fixed instead: B904 (client.py login() now chains with
# `from e`) and E501 (see the scoped exception below, which keeps line-length =
# 120 enforced for the rest of the tree instead of inert everywhere).

[tool.ruff.lint.per-file-ignores]
# TODO: one 169-char f-string in Movement.__repr__ (movements/tracked.py:326) that
# `ruff format` cannot split. Wrap it and delete this entry - it is the only
# reason E501 is not simply on everywhere.
"src/empire_core/movements/tracked.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# No `branch` key: that is python-semantic-release v7 syntax, silently ignored
# by v9+. The default branch group already matches master.
# `uv lock` re-stamps the project's own version in uv.lock, which version_toml
# does not touch: without it the lock keeps the previous version and
# `uv lock --check` / `uv sync --locked` fail on a fresh clone. It runs before
# semantic-release stages its changes, and only `assets` paths are committed
# alongside the bump, so both halves are required. A plain `uv lock` does not
# upgrade already-locked dependencies, so this cannot smuggle unrelated bumps
# into a release commit.
build_command = "uv lock && uv build"
assets = ["uv.lock"]
commit_message = "chore(release): {version}"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "build", "chore", "docs", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.changelog]
# A copy of the default conventional templates, fixed to list every breaking
# change: the default reads only the first commit of each section.
template_dir = "templates"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
