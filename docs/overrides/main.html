{% extends "base.html" %}

{% block extrahead %}
  {% set image = config.site_url ~ "assets/social-preview.png" %}
  {% set description = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page.title if page and page.title and not page.is_homepage else config.site_name }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ image }}">
{% endblock %}
