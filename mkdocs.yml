          - Messages: guides/messages.md
          - Castle: guides/castle.md
          - Army: guides/army.md
          - Commanders: guides/commanders.md
          - Skills and generals: guides/skills.md
          - Equipment: guides/equipment.md
          - Attack: guides/attack.md
          - Filling waves: guides/filling-waves.md
          - Spy: guides/spy.md
          - Map scanning: guides/map-scanning.md
      - Game state:
          - State and freshness: guides/game-state.md
          - Reacting to movements: guides/movements.md
      - Game data:
          - Lookups by name: guides/game-data.md
          - Generated ids: guides/game-data-ids.md
      - Beyond one client:
          - Multiple accounts: guides/multiple-accounts.md
          - Protocol models: guides/protocol-models.md
          - Error handling: guides/errors.md
  - API reference:
      - reference/index.md
      - Core:
          - Client: reference/client.md
          - State: reference/state.md
          - Exceptions: reference/exceptions.md
          - Enums: reference/enums.md
          - Game data: reference/gamedata.md
          - Protocol: reference/protocol.md
          - Utilities: reference/utils.md
      - Areas:
          - Map: reference/map.md
          - Ranking: reference/ranking.md
          - Events: reference/events.md
          - Commanders: reference/commanders.md
          - Castle: reference/castle.md
          - Army: reference/army.md
          - Movements: reference/movements.md
          - Messages: reference/messages.md
          - Defense: reference/defense.md
          - Combat: reference/combat.md
          - Player: reference/player.md
          - Attack: reference/attack.md
          - Alliance: reference/alliance.md
          - Spy: reference/spy.md
  - Internals:
      - internals/index.md
      - Login and requests: internals/login-and-requests.md
      - Architecture: design/architecture.md
      - Protocol: design/protocol.md
      - State management: design/state_management.md
      - Client bundle notes: design/game_bundle_analysis.md
  - Changelog: changelog.md
  - Contributing: contributing.md
