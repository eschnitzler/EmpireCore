site_name: EmpireCore
site_description: A fully typed Python client for Goodgame Empire
site_url: https://eschnitzler.github.io/EmpireCore/
repo_url: https://github.com/eschnitzler/EmpireCore
repo_name: eschnitzler/EmpireCore
edit_uri: edit/master/docs/
copyright: MIT licensed. Not affiliated with Goodgame Studios.

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  hooks.py
  griffe_extensions.py
  templates/
  overrides/
  design/combat_effects.md
  design/fill_waves_spec.md

hooks:
  - docs/hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  icon:
    logo: empirecore/mark
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eschnitzler/EmpireCore
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/empire-core/

plugins:
  - search
  - mkdocstrings:
      custom_templates: docs/templates
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            extensions:
              - docs/griffe_extensions.py:MarkdownDocstrings
              - griffe_pydantic:
                  schema: false
            filters: ["!^_", "!^command$", "!^response_command$"]
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 3
            members_order: source
            group_by_category: true
            show_category_heading: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: true
            show_labels: true
            summary: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
